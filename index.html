    /* Animasi Latar Belakang Pelbagai Lapisan */
    @keyframes floatCloud {

      100% { transform: translateX(calc(100vw + 150px)); }
    }
    @keyframes bobbing {
      0%, 100% { transform: translateY(0px) rotate(0deg); }

    @keyframes sway {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }

    @keyframes twinkle {

      50% { opacity: 1; transform: scale(1.1); }

    @keyframes popBounce {

      60% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes monsterBounce {

    @keyframes monsterShake {

  <script>
    // Penjana Bunyi Sintesis Mesra Kanak-kanak
    class SoundFX {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playTap() {
        if (this.muted) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.09);
      }
      playPop(pitchModifier = 1) {
        if (this.muted) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        const baseFreq = 320 * pitchModifier;
        osc.frequency.setValueAtTime(baseFreq, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 2.2, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.13);
      }
      playBite() {
        if (this.muted) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(250, this.ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.16);
      }
      playCorrect() {
        if (this.muted) return;
        this.init();
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
          gain.gain.setValueAtTime(0, this.ctx.currentTime + idx * 0.08);
          gain.gain.linearRampToValueAtTime(0.25, this.ctx.currentTime + idx * 0.08 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.08 + 0.35);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + idx * 0.08);
          osc.stop(this.ctx.currentTime + idx * 0.08 + 0.36);
        });
      }
      playWrong() {
        if (this.muted) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(280, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(180, this.ctx.currentTime + 0.22);
        gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.22);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.23);
      }
      playCelebrate() {
        if (this.muted) return;
        this.init();
        const fanfare = [523.25, 523.25, 523.25, 659.25, 783.99, 1046.50];
        const times = [0, 0.12, 0.24, 0.38, 0.52, 0.70];
        fanfare.forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + times[i]);
          gain.gain.setValueAtTime(0.3, this.ctx.currentTime + times[i]);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + times[i] + 0.28);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + times[i]);
          osc.stop(this.ctx.currentTime + times[i] + 0.3);
        });
      }
    }
    const sound = new SoundFX();
  </script>

      if (state === 'happy' || state === 'correct') {
        bodyClass = 'anim-monster-happy';
        faceSVG = `
          <path d="M 32 46 Q 38 40 44 46" stroke="#2D1100" stroke-width="4" stroke-linecap="round" fill="none"/>
          <path d="M 56 46 Q 62 40 68 46" stroke="#2D1100" stroke-width="4" stroke-linecap="round" fill="none"/>
          <path d="M 38 56 Q 50 72 62 56 Z" fill="#990000" stroke="#2D1100" stroke-width="3"/>
          <polygon points="46,56 50,56 48,60" fill="#FFF"/>
          <circle cx="28" cy="54" r="5" fill="#FF4D6D" opacity="0.7"/>
          <circle cx="72" cy="54" r="5" fill="#FF4D6D" opacity="0.7"/>
        `;
      } else if (state === 'hungry' || state === 'feeding') {
        faceSVG = `
          <circle cx="38" cy="45" r="7" fill="#2D1100"/>
          <circle cx="40" cy="43" r="3" fill="#FFF"/>
          <circle cx="62" cy="45" r="7" fill="#2D1100"/>

          <polygon points="48,52 52,52 50,56" fill="#FFF"/>
          <circle cx="28" cy="54" r="4.5" fill="#FF4D6D" opacity="0.6"/>
          <circle cx="72" cy="54" r="4.5" fill="#FF4D6D" opacity="0.6"/>
        `;
      } else if (state === 'wrong') {
        bodyClass = 'anim-monster-wrong';
        faceSVG = `
          <circle cx="38" cy="46" r="5" fill="#2D1100"/>
          <circle cx="62" cy="46" r="5" fill="#2D1100"/>

        faceSVG = `
          <circle cx="38" cy="46" r="6" fill="#2D1100"/>

      return `
        <div class="relative w-20 h-20 sm:w-24 sm:h-24 md:w-28 md:h-28 ${bodyClass} transition-all duration-300">

  <!-- ==================== ENJIN LOGIK DAN KEADAAN PERMAINAN ==================== -->
  <script>
    class AdditionAdventure {
      constructor() {
        this.lang = 'bm';
        this.profile = {
          name: '',
          familyCode: ''
        };
        this.category = 'mudah';
        this.questionMode = 10;
        
        this.currentQuestionIndex = 0;
        this.totalQuestions = 10;
        this.score = 0;
        this.correctCount = 0;
        this.currentQuestion = null;
        this.questionFingerprints = [];
        this.monsterState = 'idle';
        this.hintActive = false;
        this.isProcessingAnswer = false;

        this.loadStorage();
      }

      loadStorage() {
        try {
          const savedLang = localStorage.getItem('jt_lang');
          if (savedLang === 'bm' || savedLang === 'en') {
            this.lang = savedLang;
          }
          const savedProfile = localStorage.getItem('jt_profile');
          if (savedProfile) {
            this.profile = JSON.parse(savedProfile);
            if (!this.profile.familyCode) this.profile.familyCode = '';
          }
          const savedCat = localStorage.getItem('jt_last_category');
          if (savedCat === 'mudah' || savedCat === 'pro') {
            this.category = savedCat;
          }
          const savedFingerprints = localStorage.getItem('jt_fingerprints');
          if (savedFingerprints) {
            this.questionFingerprints = JSON.parse(savedFingerprints);
          }
        } catch (e) {
          console.warn('Ralat LocalStorage:', e);
        }
      }

      saveStorage() {
        try {
          localStorage.setItem('jt_lang', this.lang);
          localStorage.setItem('jt_profile', JSON.stringify(this.profile));
          localStorage.setItem('jt_last_category', this.category);
          localStorage.setItem('jt_fingerprints', JSON.stringify(this.questionFingerprints.slice(-40)));
        } catch (e) {
          console.warn('Ralat simpan LocalStorage:', e);
        }
      }

      saveScoreRecord() {
        if (!this.profile.name) return;
        try {
          const raw = localStorage.getItem('jt_scores');
          const list = raw ? JSON.parse(raw) : [];
          const record = {
            id: 'rec_' + Date.now(),
            childName: this.profile.name,
            familyCode: this.profile.familyCode || '',
            score: this.score,
            correct: this.correctCount,
            totalQ: this.questionMode === 'free' ? this.currentQuestionIndex : this.totalQuestions,
            category: this.category,
            date: new Date().toLocaleDateString(this.lang === 'bm' ? 'ms-MY' : 'en-US', { day: 'numeric', month: 'short', year: 'numeric' })
          };
          list.unshift(record);
          localStorage.setItem('jt_scores', JSON.stringify(list.slice(0, 50)));
        } catch (e) {
          console.warn('Ralat simpan skor:', e);
        }
      }

      getScores() {
        try {
          const raw = localStorage.getItem('jt_scores');
          return raw ? JSON.parse(raw) : [];
        } catch (e) {
          return [];
        }
      }

      t(key) {
        return (I18N[this.lang] && I18N[this.lang][key]) || key;
      }

      setLanguage(newLang) {
        sound.playTap();
        this.lang = newLang;
        this.saveStorage();
        this.updateLangButtons();
        this.refreshCurrentScreen();
      }

      updateLangButtons() {
        const btnBM = document.getElementById('langBM');
        const btnEN = document.getElementById('langEN');
        const titleEl = document.getElementById('topAppTitle');
        if (btnBM && btnEN) {
          if (this.lang === 'bm') {
            btnBM.className = "px-2.5 py-1 rounded-xl text-xs font-bold transition-all bg-brand-pink text-white shadow-sm";
            btnEN.className = "px-2.5 py-1 rounded-xl text-xs font-bold transition-all text-gray-700 hover:text-brand-pink";
            titleEl.textContent = "JOM TAMBAH";
          } else {
            btnEN.className = "px-2.5 py-1 rounded-xl text-xs font-bold transition-all bg-brand-pink text-white shadow-sm";
            btnBM.className = "px-2.5 py-1 rounded-xl text-xs font-bold transition-all text-gray-700 hover:text-brand-pink";
            titleEl.textContent = "ADDITION ADVENTURE";
          }
        }
      }

      toggleSound() {
        sound.muted = !sound.muted;
        const icon = document.getElementById('soundIcon');
        if (icon) {
          icon.innerHTML = sound.muted ? ICONS.soundOff : ICONS.soundOn;
        }
      }

      refreshCurrentScreen() {
        const container = document.getElementById('mainScreenContainer');
        if (!container) return;
        const view = container.dataset.view;
        if (view === 'profile') this.showProfileScreen();
        else if (view === 'home') this.showHomeScreen();
        else if (view === 'gameplay') this.renderGameplayUI();
        else if (view === 'result') this.showResultScreen();
        else if (view === 'collection') this.showCollectionScreen();
        else if (view === 'scoreboard') this.showScoreboardScreen();
        else this.showHomeScreen();
      }

      goToHome() {
        sound.playTap();
        this.showHomeScreen();
      }

      // ==================== SKRIN 1: PROFIL PENGGUNA ====================

        const container = document.getElementById('mainScreenContainer');
        container.dataset.view = 'profile';
        document.getElementById('navHomeBtn').classList.add('hidden');

              ${renderMonsterSVG('idle')}

            <div class="mt-8 mb-4">

                <input type="text" id="profFamilyInput" maxlength="12" value="${this.profile.familyCode || ''}" placeholder="${this.t('familyCodePlaceholder')}" class="w-full px-4 py-3 rounded-2xl border-2 border-blue-300 focus:border-brand-purple focus:outline-none font-bold text-gray-800 text-base shadow-inner bg-blue-50/40">
              </div>

              <div class="pt-2">
                <button type="submit" class="w-full py-3.5 rounded-2xl text-lg font-bold text-white btn-3d btn-3d-green heading-font tracking-wider flex items-center justify-center gap-2">

        this.profile.name = nameVal;
        this.profile.familyCode = famVal;
        this.saveStorage();
        this.showHomeScreen();
      }

      selectCategoryAndConfig(cat) {
        sound.playTap();

      setQuestionCount(cnt) {
        sound.playTap();
        this.questionMode = cnt;
        this.showHomeScreen();
      }

      startAdditionGame() {
        sound.playTap();
        this.currentQuestionIndex = 0;
        this.totalQuestions = this.questionMode === 'free' ? 9999 : this.questionMode;
        this.score = 0;
        this.correctCount = 0;
        this.hintActive = false;
        this.monsterState = 'hungry';
        this.nextQuestion();
      }

      generateUniqueQuestion() {
        let attempts = 0;
        let q = null;

        while (attempts < 50) {
          attempts++;
          let num1, num2, total;

          if (this.category === 'mudah') {
            total = Math.floor(Math.random() * 8) + 2;
            num1 = Math.floor(Math.random() * (total - 1)) + 1;
            num2 = total - num1;
          } else {
            total = Math.floor(Math.random() * 10) + 10;
            num1 = Math.floor(Math.random() * (total - 2)) + 1;
            if (num1 > 12) num1 = 12;
            num2 = total - num1;
            if (num2 <= 0 || num2 >= 19) continue;
          }

          const artwork = ARTWORKS[Math.floor(Math.random() * ARTWORKS.length)];
          const fingerprint = `${this.category}_${num1}+${num2}_${artwork.id}`;

          if (!this.questionFingerprints.includes(fingerprint) || attempts > 40) {
            const choices = this.generateDistractors(total, this.category === 'mudah' ? 3 : 4);
            q = {
              num1,
              num2,
              total,
              artwork,
              fingerprint,
              choices
            };
            this.questionFingerprints.push(fingerprint);
            break;
          }
        }

        return q;
      }

      generateDistractors(correctAnswer, count = 3) {
        const set = new Set([correctAnswer]);
        const offsets = [-2, -1, 1, 2, 3, -3];
        offsets.sort(() => Math.random() - 0.5);

        for (const off of offsets) {
          if (set.size >= count) break;
          const candidate = correctAnswer + off;
          if (this.category === 'mudah' && (candidate < 0 || candidate > 9)) continue;
          if (this.category === 'pro' && (candidate < 1 || candidate > 19)) continue;
          set.add(candidate);
        }

        let fallback = this.category === 'mudah' ? 1 : 10;
        while (set.size < count) {
          if (!set.has(fallback)) set.add(fallback);
          fallback++;
        }

        const arr = Array.from(set);
        arr.sort(() => Math.random() - 0.5);
        return arr;
      }

      nextQuestion() {
        this.currentQuestionIndex++;
        if (this.questionMode !== 'free' && this.currentQuestionIndex > this.totalQuestions) {
          this.finishGameSession();
          return;
        }

        this.hintActive = false;
        this.isProcessingAnswer = false;
        this.monsterState = 'hungry';
        this.currentQuestion = this.generateUniqueQuestion();
        this.saveStorage();
        this.renderGameplayUI();

        setTimeout(() => {
          sound.playPop(1);
          setTimeout(() => sound.playPop(1.3), 350);
        }, 150);
      }

          this.monsterState = 'happy';

          sound.playBite();
          setTimeout(() => sound.playCorrect(), 120);

          const eqMark = document.getElementById('equationQuestionMark');
          if (eqMark) {

                    ${ICONS.star} <span>${rec.score}</span>
                  </div>
                  <div class="text-[11px] font-bold text-emerald-700">${rec.correct}/${rec.totalQ} ${this.lang === 'bm' ? 'Betul' : 'Correct'}</div>
                </div>
              </div>
            `;
          }).join('');

        container.innerHTML = `
          <div class="w-full max-w-2xl bg-white/95 backdrop-blur-md rounded-3xl p-4 sm:p-6 shadow-2xl border-4 border-yellow-300 flex flex-col h-[82vh] max-h-[700px] anim-pop">
            
            <div class="flex items-center justify-between gap-2 border-b-2 border-dashed border-amber-200 pb-3 mb-2">
              <div>
                <h2 class="heading-font text-2xl text-brand-orange flex items-center gap-2">
                  ${ICONS.trophy} <span>${this.t('scoreboardTitle')}</span>
                </h2>
                <p class="text-xs font-semibold text-gray-600">${this.t('scoreboardDesc')}</p>
              </div>
              <button onclick="game.goToHome()" class="p-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-2xl border border-gray-300 text-xs font-bold">
                ✕
              </button>
            </div>

            <div class="flex gap-2 my-2">
              <button onclick="game.showScoreboardScreen('all')" class="flex-1 py-1.5 rounded-xl text-xs font-bold transition-all ${filterCat === 'all' ? 'bg-brand-orange text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}">
                ${this.lang === 'bm' ? 'Semua' : 'All'}
              </button>
              <button onclick="game.showScoreboardScreen('mudah')" class="flex-1 py-1.5 rounded-xl text-xs font-bold transition-all ${filterCat === 'mudah' ? 'bg-brand-orange text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}">
                ${this.lang === 'bm' ? 'Mudah (<10)' : 'Easy (<10)'}
              </button>
              <button onclick="game.showScoreboardScreen('pro')" class="flex-1 py-1.5 rounded-xl text-xs font-bold transition-all ${filterCat === 'pro' ? 'bg-brand-orange text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}">
                ${this.lang === 'bm' ? 'Pro (<20)' : 'Pro (<20)'}
              </button>
            </div>

            <div class="flex-1 overflow-y-auto space-y-2 pr-1">
              ${rowsHtml}
            </div>

          </div>
        `;
      }
    }

    let game;
    window.addEventListener('DOMContentLoaded', () => {
      game = new AdditionAdventure();
      game.updateLangButtons();

      const soundIconEl = document.getElementById('soundIcon');
      if (soundIconEl) {
        soundIconEl.innerHTML = sound.muted ? ICONS.soundOff : ICONS.soundOn;
      }

      if (!game.profile.name) {
        game.showProfileScreen();
      } else {
        game.showHomeScreen();
      }
    });
  </script>
</body>
</html>
